# Postgres for jordbot-dev (site-monitoring plan, 2026-10-14), so database
# changes can be tested before prod. Same manifests as k8s/postgres/, in the
# dev namespace. Setup steps, including the two secrets, are in README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: jordbot-dev
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 1Gi  # dev: test data only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: jordbot-dev
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC — old pod must release before new pod binds
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jordbot-dev
  labels:
    app: postgres
spec:
  type: ClusterIP  # internal only — never expose Postgres on a Route
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
