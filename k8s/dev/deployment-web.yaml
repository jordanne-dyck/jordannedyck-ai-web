apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jordannedyck-ai-web
  name: jordannedyck-ai-web
  namespace: jordbot-dev
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: jordannedyck-ai-web
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-10-13T21:29:45-04:00"
      creationTimestamp: null
      labels:
        app: jordannedyck-ai-web
    spec:
      containers:
        - env:
            - name: FLASK_API_URL
              value: http://jordannedyck-ai:5000
            # The backend's /chat writes the answers (engine/chat.py). Unset or
            # "ts": route.ts's own pipeline, which prod runs.
            - name: ANSWER_ENGINE
              value: python
            - name: NODE_ENV
              value: production
            # PostHog analytics (app/api/analytics-config). The project token is public
            # by design: the browser gets it on every page load, and it can send
            # events, not read them. EU region.
            - name: POSTHOG_PROJECT_TOKEN
              value: phc_qco9d4iBCQxQptgYCHXbvBfp2sYvNAToijuoSy2kN9QX
            - name: POSTHOG_HOST
              value: https://eu.i.posthog.com
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: app-database-url
            - name: DASHBOARD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DASHBOARD_ADMIN_PASSWORD
                  name: app-observability
            # Concierge lead form (app/api/lead). Prod stays off until its
            # retention CronJob deletes leads after 365 days.
            - name: LEADS_ENABLED
              value: "1"
            # Lead emails through Mailgun (lib/notify.ts). The key and Jordanne's
            # address come from Doppler via Peter; optional, so the pod starts
            # without them and leads are stored and marked not emailed.
            - name: MAIL_DOMAIN
              value: jordannedyck.com
            - name: SITE_URL
              value: https://jordbot-dev-jordbot-dev.apps.ocp-centralis.nekohouse.ca
            - name: MAIL_API_KEY
              valueFrom:
                secretKeyRef:
                  key: MAIL_API_KEY
                  name: app-observability
                  optional: true
            - name: LEAD_NOTIFY_TO
              valueFrom:
                secretKeyRef:
                  key: LEAD_NOTIFY_TO
                  name: app-observability
                  optional: true
            - name: IP_HASH_SALT
              valueFrom:
                secretKeyRef:
                  key: IP_HASH_SALT
                  name: app-observability
            - name: MONITOR_TOKEN
              valueFrom:
                secretKeyRef:
                  key: MONITOR_TOKEN
                  name: app-observability
            # /api/admin/* (export, eval candidates, themes). Optional so the pod
            # starts before the key exists; the admin routes refuse until it does.
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: ADMIN_API_TOKEN
                  name: app-observability
                  optional: true
            - name: TURN_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  key: TURN_SIGNING_KEY
                  name: app-observability
                  optional: true
          envFrom:
            - secretRef:
                name: openai-api-key
          image: quay.nekohouse.ca:8443/peter/jordbot-web:dev
          imagePullPolicy: Always
          name: jordannedyck-ai-web
          ports:
            - containerPort: 3000
              protocol: TCP
          # Probes and resources from measurements on 2026-11-12. Not /api/health:
          # it calls the database, OpenAI and the backend on every request, so a
          # slow OpenAI would fail the probe. Readiness renders / with a 5 s
          # timeout; liveness is TCP, so only a dead Node process restarts the pod.
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 2
            failureThreshold: 30  # 1 minute; Next.js is ready in under a second today
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # Measured 118-166 MiB. Provisional until 30-day peaks are in.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: quaynekohouse
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
