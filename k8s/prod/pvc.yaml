    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  name: faiss-db
  namespace: jordbot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: nfs-csi
  volumeMode: Filesystem
  volumeName: pvc-6488b6b0-d089-4273-9e99-df187e48d9b5
