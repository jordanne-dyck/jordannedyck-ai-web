apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    app: postgres
  name: postgres-data
  namespace: jordbot-dev
spec:
  accessModes:
    - ReadWriteOnce
