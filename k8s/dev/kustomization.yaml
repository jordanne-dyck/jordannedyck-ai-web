# Dev (namespace jordbot-dev). Argo CD renders this folder with `kustomize build`
# and keeps the cluster in sync with it. Dev runs the :dev images that the
# Shipwright Builds in builds.yaml push; start a build with buildruns.yaml.
#
# Not in this repo, on purpose: the Namespace, ServiceAccounts and RBAC,
# the ExternalSecrets and the quaynekohouse push/pull secret. Peter manages those.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jordbot-dev
resources:
  - deployment-api.yaml
  - deployment-web.yaml
  - services.yaml
  - route.yaml
  - pvc.yaml
  - postgres.yaml
  - postgres-schema.yaml
  - builds.yaml
