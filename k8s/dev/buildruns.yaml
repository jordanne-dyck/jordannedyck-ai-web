# Not part of the kustomization (generateName objects cannot be synced by Argo CD).
# Start a dev build of both images: oc create -f k8s/dev/buildruns.yaml
apiVersion: shipwright.io/v1beta1
kind: BuildRun
metadata:
  generateName: jordbot-ai-
  namespace: jordbot-dev
spec:
  build:
    name: jordbot-ai
---
apiVersion: shipwright.io/v1beta1
kind: BuildRun
metadata:
  generateName: jordbot-web-
  namespace: jordbot-dev
spec:
  build:
    name: jordbot-web
