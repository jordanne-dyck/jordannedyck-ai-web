apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: jordbot
  namespace: jordbot
spec:
  host: jordbot-jordbot.apps.ocp-centralis.nekohouse.ca
  port:
    targetPort: 3000
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: jordannedyck-ai-web
    weight: 100
  wildcardPolicy: None
