    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  name: faiss-db
  namespace: jordbot-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: nfs-csi
  volumeMode: Filesystem
  volumeName: pvc-970ec02c-ac39-4b9c-8154-8c6da465c50e
