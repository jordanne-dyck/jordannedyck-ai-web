apiVersion: apps/v1
kind: Deployment
metadata:
  name: jordannedyck-ai-web
  namespace: jordbot-dev
  labels:
    app: jordannedyck-ai-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jordannedyck-ai-web
  template:
    metadata:
      labels:
        app: jordannedyck-ai-web
    spec:
      imagePullSecrets:
      - name: registry-pull-secret
      containers:
      - name: jordannedyck-ai-web
        image: REGISTRY_PLACEHOLDER/jordbot-web:dev
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: FLASK_API_URL
          value: "http://jordannedyck-ai:5000"
        - name: NODE_ENV
          value: "production"
        # PostHog (site-monitoring plan, Phase 2). The project token is public by
        # design: it can send events, not read them. The project is in the EU region.
        - name: POSTHOG_PROJECT_TOKEN
          value: "phc_qco9d4iBCQxQptgYCHXbvBfp2sYvNAToijuoSy2kN9QX"
        - name: POSTHOG_HOST
          value: "https://eu.i.posthog.com"
        envFrom:
        - secretRef:
            name: openai-api-key
        # Dev Postgres and observability settings (60-postgres.yaml, README.md).
        # Optional, so the pod still starts before Peter creates them; without
        # app-database-url nothing is logged and the dashboards error.
        - secretRef:
            name: app-database-url
            optional: true
        - secretRef:
            name: app-observability
            optional: true
