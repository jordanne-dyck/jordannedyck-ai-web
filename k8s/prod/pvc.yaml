---
# Static NFS share holding one folder per index version (kb-<knowledge-base
# commit>). Peter creates the PV; folders are written once and never edited.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  name: faiss-share
  namespace: jordbot
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 500Mi
  storageClassName: ""
  volumeMode: Filesystem
  volumeName: jordbot-faiss-share
