name: prod-smoke

# After every prod release merge: wait until https://jordannedyck.com reports
# the new jordbot-web tag on /api/health, then send real chats and check them
# (scripts/smoke-prod.mjs). Red means prod is broken: CLAUDE.md "Rollback".
# Green still needs someone to read the answers in the run summary.
on:
  push:
    branches: [master]
    paths: [k8s/prod/release/kustomization.yaml]
  workflow_dispatch:
    inputs:
      tag:
        description: 'jordbot-web tag to check (default: the one in k8s/prod/release/kustomization.yaml)'
        required: false

permissions:
  contents: read

concurrency:
  group: prod-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Prod smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '24'

      - name: Tag under test
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(grep -A1 'peter/jordbot-web$' k8s/prod/release/kustomization.yaml | sed -n 's/.*newTag: *//p')
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a vX.Y tag: '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Prod's monitor token comes from Doppler at run time (the same key the
      # prod ExternalSecret app-observability maps to MONITOR_TOKEN), so a
      # rotation in Doppler reaches this workflow without a copy on GitHub.
      # Secret values are masked in the log; only step outputs are used, no
      # inject-env-vars.
      - name: Fetch monitor token from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534  # v2.0.0
        with:
          doppler-token: ${{ secrets.JORDBOT_DOPPLER_SA }}

      - name: Check the token arrived
        env:
          DOPPLER_PROJECT: ${{ steps.doppler.outputs.DOPPLER_PROJECT }}
          DOPPLER_CONFIG: ${{ steps.doppler.outputs.DOPPLER_CONFIG }}
          HAS_TOKEN: ${{ steps.doppler.outputs.JORDBOT_MONITOR_TOKEN_PROD != '' }}
        run: |
          if [ -n "$DOPPLER_PROJECT$DOPPLER_CONFIG" ]; then
            echo "Doppler project: ${DOPPLER_PROJECT:-?}, config: ${DOPPLER_CONFIG:-?}"
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Doppler returned no JORDBOT_MONITOR_TOKEN_PROD for this token's project/config"
            exit 1
          fi

      # Argo syncs about 3 minutes after the merge; the script polls
      # /api/health for up to 10 minutes until `release` shows the tag.
      - name: Smoke test
        env:
          MONITOR_TOKEN: ${{ steps.doppler.outputs.JORDBOT_MONITOR_TOKEN_PROD }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/smoke-prod.mjs --tag "$TAG" --wait 600
