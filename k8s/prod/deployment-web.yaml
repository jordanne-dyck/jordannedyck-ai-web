apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jordannedyck-ai-web
  name: jordannedyck-ai-web
  namespace: jordbot
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: jordannedyck-ai-web
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-06-14T13:55:15-04:00"
      creationTimestamp: null
      labels:
        app: jordannedyck-ai-web
    spec:
      containers:
        - env:
            - name: FLASK_API_URL
              value: http://jordannedyck-ai:5000
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: app-database-url
            - name: DASHBOARD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DASHBOARD_ADMIN_PASSWORD
                  name: app-observability
            - name: IP_HASH_SALT
              valueFrom:
                secretKeyRef:
                  key: IP_HASH_SALT
                  name: app-observability
          envFrom:
            - secretRef:
                name: openai-api-key
          image: quay.nekohouse.ca:8443/peter/jordbot-web  # tag: release/kustomization.yaml
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 1
          name: jordannedyck-ai-web
          ports:
            - containerPort: 3000
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: quaynekohouse
        - name: registry-pull-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
