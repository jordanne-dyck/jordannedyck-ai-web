apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jordannedyck-ai
  name: jordannedyck-ai
  namespace: jordbot
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: jordannedyck-ai
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-06-14T13:55:15-04:00"
      creationTimestamp: null
      labels:
        app: jordannedyck-ai
    spec:
      containers:
        - envFrom:
            - secretRef:
                name: openai-api-key
          env:
            # One immutable version folder on the faiss-share volume. Changing
            # this line is how an index is promoted; reverting it rolls back.
            - name: FAISS_DIR
              value: /faiss/kb-3f6f4b8
          image: quay.nekohouse.ca:8443/peter/jordbot  # tag: release/kustomization.yaml
          imagePullPolicy: Always
          name: jordannedyck-ai
          ports:
            - containerPort: 5000
              protocol: TCP
          # Probes and resources from measurements on 2026-11-12. gunicorn binds
          # :5000 about 2 s before the worker has loaded the index, so TCP only
          # proves the process is up; readiness asks /health, which the worker
          # answers only once the index is loaded. /health calls OpenAI at most
          # once a minute (5 s timeout), so readiness allows 6 s. Liveness stays on
          # TCP so an OpenAI outage never restarts the pod.
          startupProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 5
            failureThreshold: 24  # 2 minutes to bind; the index loads in ~2 s today
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # Measured peak ~137 MiB (dev, 2.8 days uptime). Provisional until 30-day
          # peaks are in. No CPU limit: throttling would slow streamed answers.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /opt/app-root/src/faiss_db
              name: faiss-db
            - mountPath: /faiss
              name: faiss-share
              readOnly: true
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: quaynekohouse
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: faiss-db
          persistentVolumeClaim:
            claimName: faiss-db
        - name: faiss-share
          persistentVolumeClaim:
            claimName: faiss-share
            readOnly: true
