apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jordannedyck-ai-web
  name: jordannedyck-ai-web
  namespace: jordbot
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: jordannedyck-ai-web
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-06-14T13:55:15-04:00"
      creationTimestamp: null
      labels:
        app: jordannedyck-ai-web
    spec:
      containers:
        - env:
            - name: FLASK_API_URL
              value: http://jordannedyck-ai:5000
            # The backend's /chat writes the answers (engine/chat.py), the same
            # pipeline the evals and dev e2e test. Needs a jordbot (backend) tag
            # with /chat, and a jordbot-web tag with the switch (#107). Remove
            # this to go back to route.ts's own pipeline.
            - name: ANSWER_ENGINE
              value: python
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: app-database-url
            - name: DASHBOARD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DASHBOARD_ADMIN_PASSWORD
                  name: app-observability
            # Concierge lead form (app/api/lead). Leads are deleted after 365
            # days by retention-cronjob.yaml.
            - name: LEADS_ENABLED
              value: "1"
            # Lead emails through Mailgun (lib/notify.ts). The key and Jordanne's
            # address come from Doppler via Peter; optional, so the pod starts
            # without them and leads are stored and marked not emailed.
            - name: MAIL_DOMAIN
              value: jordannedyck.com
            - name: SITE_URL
              value: https://jordannedyck.com
            - name: MAIL_API_KEY
              valueFrom:
                secretKeyRef:
                  key: MAIL_API_KEY
                  name: app-observability
                  optional: true
            - name: LEAD_NOTIFY_TO
              valueFrom:
                secretKeyRef:
                  key: LEAD_NOTIFY_TO
                  name: app-observability
                  optional: true
            - name: IP_HASH_SALT
              valueFrom:
                secretKeyRef:
                  key: IP_HASH_SALT
                  name: app-observability
            - name: MONITOR_TOKEN
              valueFrom:
                secretKeyRef:
                  key: MONITOR_TOKEN
                  name: app-observability
            # /api/admin/* (export, eval candidates, themes). Optional so the pod
            # starts before the key exists; the admin routes refuse until it does.
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: ADMIN_API_TOKEN
                  name: app-observability
                  optional: true
            - name: TURN_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  key: TURN_SIGNING_KEY
                  name: app-observability
                  optional: true
          envFrom:
            - secretRef:
                name: openai-api-key
          image: quay.nekohouse.ca:8443/peter/jordbot-web  # tag: release/kustomization.yaml
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 1
          name: jordannedyck-ai-web
          ports:
            - containerPort: 3000
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: quaynekohouse
        - name: registry-pull-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
