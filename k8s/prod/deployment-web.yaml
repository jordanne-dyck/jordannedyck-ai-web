apiVersion: apps/v1
kind: Deployment
metadata:
  name: jordannedyck-ai-web
  labels:
    app: jordannedyck-ai-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jordannedyck-ai-web
  template:
    metadata:
      labels:
        app: jordannedyck-ai-web
    spec:
      containers:
        - name: jordannedyck-ai-web
          image: REGISTRY_PLACEHOLDER/jordbot-web:v1.7
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: openai-api-key
            # Observability: DATABASE_URL (Postgres) + IP_HASH_SALT + DASHBOARD_ADMIN_PASSWORD
            - secretRef:
                name: app-database-url
            - secretRef:
                name: app-observability
          env:
            - name: FLASK_API_URL
              value: "http://jordannedyck-ai:5000"
            - name: NODE_ENV
              value: "production"
            # PostHog (site-monitoring plan, Phase 2). The project token is public by
            # design: it can send events, not read them. The project is in the EU region.
            - name: POSTHOG_PROJECT_TOKEN
              value: "phc_qco9d4iBCQxQptgYCHXbvBfp2sYvNAToijuoSy2kN9QX"
            - name: POSTHOG_HOST
              value: "https://eu.i.posthog.com"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      imagePullSecrets:
        - name: PULL_SECRET_PLACEHOLDER
